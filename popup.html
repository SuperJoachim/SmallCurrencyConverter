<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h2 class="header-title">Currency Converter</h2>
            <a
                href="config.html"
                class="settings-link"
                title="Configure currencies"
                aria-label="Open currency configuration"
                target="_blank"
                rel="noopener noreferrer"
            >⚙️</a>
        </div>

        <div id="fieldsContainer"></div>
        <div id="loading" class="loading" aria-live="polite" hidden>
            Loading exchange rates...
        </div>
        <div id="error" class="error" aria-live="polite" hidden></div>
    </div>

    <script src="shared.js"></script>
    <script src="popup.js"></script>
</body>
</html>
